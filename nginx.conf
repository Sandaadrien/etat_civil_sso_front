server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques servis sous le préfixe /sso-assets/
    # (/sso-assets/assets/x.js -> /usr/share/nginx/html/assets/x.js)
    location ^~ /sso-assets/ {
        alias /usr/share/nginx/html/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Pages de la SPA (sign-in, consent, etc.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}